name: build
on:
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-southeast-1
  ECR_REGISTRY: 465853822810.dkr.ecr.ap-southeast-1.amazonaws.com
  IMAGE: green-pulse/backend

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Show OIDC subject
        run: echo "${{ github.repository }} / ${{ github.ref }}"

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::465853822810:role/green-pulse-github-ecr-push
          aws-region: ${{ env.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@v2

      - name: Build
        run: docker build --platform linux/amd64 -t $ECR_REGISTRY/$IMAGE:${{ github.sha }} .

      - name: Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.ECR_REGISTRY }}/${{ env.IMAGE }}:${{ github.sha }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '0'

      - name: Push
        run: docker push $ECR_REGISTRY/$IMAGE:${{ github.sha }}
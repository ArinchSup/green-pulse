name: Green Pulse CI/CD

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4


    - name: Set up python
      uses: actions/setup-python@v5
     
  deploy:
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'


    permissions:
      id-token: write
      contents: read

    steps:
      - name: Deploy to EC2 by configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::465853822810:role/green-pulse-github-deploy
          aws-region: ap-southeast-1

      - name: Deploy via AWS SSM
        run: |
          INSTANCE_ID="i-0bf07aa1199a37d2b"
          REGION="ap-southeast-1"


          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript"  \
            --parameters 'commands=[
            "git config --global --add safe.directory /home/ubuntu/green-pulse",
            "cd /home/ubuntu/green-pulse && git pull origin main",
            "echo FINNHUB_API_KEY=${{ secrets.FINNHUB_API_KEY }} > /home/ubuntu/green-pulse/.env",
            "echo IS_LOCAL=${{ secrets.IS_LOCAL }} >> /home/ubuntu/green-pulse/.env",
            "echo GRAFANA_PASSWORD=${{ secrets.GRAFANA_PASSWORD }} >> /home/ubuntu/green-pulse/.env",
            "echo SUPADBPASS=${{ secrets.SUPADBPASS }} >> /home/ubuntu/green-pulse/.env",
            "echo DATABASE=${{ secrets.DATABASE }} >> /home/ubuntu/green-pulse/.env",
            "echo SUPADBHOST=${{ secrets.SUPADBHOST }} >> /home/ubuntu/green-pulse/.env",
            "echo SUPADBPORT=${{ secrets.SUPADBPORT }} >> /home/ubuntu/green-pulse/.env",
            "echo ClientID=${{ secrets.CLIENTID }} >> /home/ubuntu/green-pulse/.env",
            "echo ClientSecret=${{ secrets.CLIENTSECRET }} >> /home/ubuntu/green-pulse/.env",
            "cd /home/ubuntu/green-pulse && sudo -u ubuntu docker compose up --build -d",
            "sudo -u ubuntu docker image prune -f"
            ]' \
            --region "$REGION" \
            --query "Command.CommandId" \
            --output text)


            echo "Command is processing"
            aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --region "$REGION" 

            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --region "$REGION" \
              --query "Status" \
              --output text)

            echo "The command is executed"

            if [ "$STATUS" != "Success" ]; then
            echo "The execution is failed"
            exit 1;
            fi
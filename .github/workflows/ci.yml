name: Green Pulse CI/CD

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4


    - name: Set up python
      uses: actions/setup-python@v5
     
  deploy:
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'


    permissions:
      id-token: write
      contents: read



    env:
      FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
      IS_LOCAL: ${{ secrets.IS_LOCAL }}
      GRAFANA_PASSWORD: ${{ secrets.GRAFANA_PASSWORD }}
      SUPADBPASS: ${{ secrets.SUPADBPASS }}
      DATABASE: ${{ secrets.DATABASE }}
      SUPADBHOST: ${{ secrets.SUPADBHOST }}
      SUPADBPORT: ${{ secrets.SUPADBPORT }}
      CLIENTID: ${{ secrets.CLIENTID }}
      CLIENTSECRET: ${{ secrets.CLIENTSECRET }}



    steps:
      - name: Deploy to EC2 by configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::465853822810:role/green-pulse-github-deploy
          aws-region: ap-southeast-1


      - name: Write .env to EC2
        run: |
          INSTANCE_ID="i-0977464bde6edc615"
          REGION="ap-southeast-1"

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters commands=["HOME=/root git config --global --add safe.directory /home/ubuntu/green-pulse","python3 -c \"import os; f=open('/home/ubuntu/green-pulse/.env','w'); [f.write(k+'='+v+'\\n') for k,v in os.environ.items() if k in ['FINNHUB_API_KEY','IS_LOCAL','GRAFANA_PASSWORD','SUPADBPASS','DATABASE','SUPADBHOST','SUPADBPORT','CLIENTID','CLIENTSECRET']]; f.close()\""] \
            --region "$REGION" \
            --query "Command.CommandId" \
            --output text)

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --region "$REGION"

      - name: Deploy via AWS SSM
        run: |
          INSTANCE_ID="i-0977464bde6edc615"
          REGION="ap-southeast-1"

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters commands=["cd /home/ubuntu/green-pulse && git pull origin main","cd /home/ubuntu/green-pulse && sudo -u ubuntu docker compose up --build -d","sudo -u ubuntu docker image prune -f"] \
            --region "$REGION" \
            --query "Command.CommandId" \
            --output text)

          echo "Command is processing"
          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --region "$REGION"

          STATUS=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --region "$REGION" \
            --query "Status" \
            --output text)

            echo "The command is executed: $STATUS"

            if [ "$STATUS" != "Success" ]; then
            echo "The execution is failed"
            exit 1;
            fi